name: 매물 검색

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: 다시 실행할 검색 이슈 번호
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: slp-search  # 결과 커밋이 겹치지 않게 한 번에 하나씩
  cancel-in-progress: false

jobs:
  search:
    # 저장소 주인이 연 검색 이슈만 처리 (공개 저장소에서 남이 API 할당량을 쓰지 못하게)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((startsWith(github.event.issue.title, '[검색]') || contains(github.event.issue.labels.*.name, 'search')) &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 이슈 본문 가져오기
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/body.md"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: 검색 실행
        id: run
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set +e
          python -m slp search --issue-body "$RUNNER_TEMP/body.md" \
            --issue ${{ steps.issue.outputs.number }} --summary "$RUNNER_TEMP/summary.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: 결과 커밋
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name "slp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "검색 결과: 이슈 #${{ steps.issue.outputs.number }}"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: 이슈에 결과 댓글
        if: always() && steps.issue.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$RUNNER_TEMP/summary.md"
          [ -s "$f" ] || echo "### ❌ 검색 중 오류가 났습니다. [실행 기록](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})을 확인해 주세요." > "$f"
          gh issue comment ${{ steps.issue.outputs.number }} --repo "$GITHUB_REPOSITORY" --body-file "$f"
